<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09172d">
<title>Sem conexão · Resibook</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: #f4f7fb; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e2e8f0; border-top: 3px solid #0e7490;
    border-radius: 14px; padding: 28px 24px; text-align: center; }
  img { width: 48px; height: 48px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: #475569; margin: 0 0 16px; }
  ul { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 8px; }
  a { display: block; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; color: #155e75;
    font-weight: 600; font-size: 14px; text-decoration: none; }
  button { height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: #155e75; color: #fff;
    font-weight: 600; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/resibook-icon.svg" alt="">
  <h1>Você está sem internet</h1>
  <p>Esta página precisa de conexão. Os protocolos que você já abriu neste aparelho continuam disponíveis:</p>
  <ul>
    <li><a href="/acls">ACLS</a></li>
    <li><a href="/calculadoras">Calculadoras clínicas</a></li>
    <li><a href="/ecg-guiado">ECG guiado</a></li>
  </ul>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
